# Описание двух серверов: БД и бэкенд
services:
  db:
    image: postgres:18.2
    container_name: db

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}

    # Подключение доп. файлов
    volumes:
      - ./database/schema.sql:/dockчто er-entrypoint-initdb.d/1-schema.sql:ro
      - ./database/data.sql:/docker-entrypoint-initdb.d/2-data.sql:ro

    ports:
      - "5432:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  backend:
    build: .
    container_name: theatre-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL:      jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USER:     ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    stdin_open: true
    tty: true